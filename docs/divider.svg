<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 36" width="1200" height="36" role="img" xmlns:c2pa="http://c2pa.org/manifest"><title>divider</title><style>
.tw{animation:tw var(--d,4s) ease-in-out var(--dl,0s) infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes tw{from{opacity:.66;transform:scale(.92)}to{opacity:1;transform:scale(1.08)}}
.fl{animation:fl 9s linear infinite}
@keyframes fl{to{stroke-dashoffset:-60}}
.sh{opacity:0;animation:sh var(--d,12s) linear var(--dl,0s) infinite}
@keyframes sh{0%{opacity:0;transform:translate(0,0)}3%{opacity:1}15%{opacity:0;transform:translate(-260px,138px)}100%{opacity:0;transform:translate(-260px,138px)}}
.zz{animation:zz 4s ease-in-out var(--dl,0s) infinite;transform-box:fill-box}
@keyframes zz{0%{opacity:0;transform:translateY(0)}30%{opacity:.9}100%{opacity:0;transform:translateY(-12px)}}
.pulse{animation:pl 3.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pl{0%{opacity:.75;transform:scale(1)}100%{opacity:0;transform:scale(2.5)}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 1.6s ease-out var(--dl,0s) forwards}
@keyframes dr{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.tw,.fl,.sh,.zz,.pulse{animation:none}.draw{animation:none;stroke-dashoffset:0}.sh{opacity:0}}
.t{font-family:ui-rounded,"SF Pro Rounded",Nunito,"Segoe UI",system-ui,sans-serif}
.s{font-family:Georgia,"Times New Roman",serif;font-style:italic}
