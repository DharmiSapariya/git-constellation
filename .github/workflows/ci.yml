name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # PNG export draws text with the machine's fonts and the runner has almost none, so install
      # a few; otherwise labels would render without glyphs in the picture tests.
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core fonts-liberation
      - run: cargo build --all-targets
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo fmt --check
